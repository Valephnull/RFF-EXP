name: Windows Portable Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-portable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MSYS2 CLANG64
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            git
            zip
            mingw-w64-clang-x86_64-gmp
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-opencv
            mingw-w64-clang-x86_64-vulkan-loader
            mingw-w64-clang-x86_64-vulkan-headers
            mingw-w64-clang-x86_64-glm
            mingw-w64-clang-x86_64-glfw
            mingw-w64-clang-x86_64-ntldd

      - name: Get ImGui
        shell: msys2 {0}
        run: |
          if [ ! -d extern/imgui ]; then
            mkdir -p extern

            git clone \
              --depth 1 \
              https://github.com/ocornut/imgui \
              extern/imgui
          fi

      - name: Detect MSYS2 root
        shell: msys2 {0}
        run: |
          MSYS2_ROOT="$(cygpath -m /)"

          echo "Detected MSYS2 root:"
          echo "$MSYS2_ROOT"

          echo "MSYS2_ROOT=$MSYS2_ROOT" >> "$GITHUB_ENV"

      - name: Verify build dependencies
        shell: msys2 {0}
        run: |
          echo "MSYS2_ROOT=$MSYS2_ROOT"

          echo
          echo "Clang:"
          clang --version

          echo
          echo "Vulkan header:"
          ls -l /clang64/include/vulkan/vulkan.h

          echo
          echo "Vulkan import library:"
          ls -l /clang64/lib/libvulkan-1.dll.a

          echo
          echo "ntldd:"
          which ntldd

      - name: Configure
        shell: msys2 {0}
        run: |
          cmake \
            -S . \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DVulkan_INCLUDE_DIR=/clang64/include \
            -DVulkan_LIBRARY=/clang64/lib/libvulkan-1.dll.a

      - name: Build
        shell: msys2 {0}
        run: |
          cmake \
            --build build \
            --parallel

      - name: Show build outputs
        shell: msys2 {0}
        run: |
          echo "Files produced in bin/:"
          find bin -maxdepth 1 -type f -printf "%f\n" | sort

          echo
          echo "DLLs produced anywhere in the build:"
          find . -type f -iname "*.dll" -print | sort

      - name: Verify RFF executable
        shell: msys2 {0}
        run: |
          if [ ! -f bin/RFF.exe ]; then
            echo "ERROR: bin/RFF.exe was not created."
            exit 1
          fi

          ls -lh bin/RFF.exe

      - name: Create portable folder
        shell: msys2 {0}
        run: |
          set -e

          PACKAGE="RFF-EXP-Windows"

          rm -rf "$PACKAGE"

          mkdir -p "$PACKAGE/bin"
          mkdir -p "$PACKAGE/res"
          mkdir -p "$PACKAGE/shaders"

          echo "Copying RFF.exe..."
          cp bin/RFF.exe "$PACKAGE/bin/"

          echo
          echo "Copying RFF-built DLLs..."

          # Copy DLLs produced directly into bin/
          find bin \
            -maxdepth 1 \
            -type f \
            -iname "*.dll" \
            -exec cp {} "$PACKAGE/bin/" \;

          # vulkan_helper may end up somewhere under build/ depending
          # on how CMake treats a Windows SHARED library.
          find build \
            -type f \
            -iname "*vulkan_helper*.dll" \
            -exec cp {} "$PACKAGE/bin/" \;

          echo
          echo "RFF-built DLLs copied:"
          find "$PACKAGE/bin" \
            -maxdepth 1 \
            -type f \
            -iname "*.dll" \
            -printf "%f\n" \
            | sort

          if [ -d res ]; then
            echo
            echo "Copying res/..."
            cp -r res/. "$PACKAGE/res/"
          fi

          if [ -d shaders ]; then
            echo
            echo "Copying shaders/..."
            cp -r shaders/. "$PACKAGE/shaders/"
          fi

          for file in \
            backup.rfl \
            backup.rfs \
            imgui.ini
          do
            if [ -f "bin/$file" ]; then
              cp "bin/$file" "$PACKAGE/bin/"
            fi
          done

      - name: Verify vulkan_helper
        shell: msys2 {0}
        run: |
          echo "Checking for vulkan_helper..."

          if ! find RFF-EXP-Windows/bin \
            -maxdepth 1 \
            -type f \
            -iname "*vulkan_helper*.dll" \
            | grep -q .
          then
            echo "ERROR: libvulkan_helper.dll was not packaged."

            echo
            echo "Searching entire repository/build:"
            find . -type f -iname "*vulkan_helper*" -print

            exit 1
          fi

          echo "Found:"
          find RFF-EXP-Windows/bin \
            -maxdepth 1 \
            -type f \
            -iname "*vulkan_helper*.dll" \
            -print

      - name: Find DLL dependencies
        shell: msys2 {0}
        run: |
          set -e

          BIN="RFF-EXP-Windows/bin"

          > dependencies.txt

          echo "Scanning RFF.exe and RFF-built DLLs..."

          while IFS= read -r -d '' file
          do
            echo "Scanning $(basename "$file")"

            ntldd -R "$file" \
              >> dependencies.txt \
              2>&1 || true

          done < <(
            find "$BIN" \
              -maxdepth 1 \
              -type f \
              \( -iname "*.exe" -o -iname "*.dll" \) \
              -print0
          )

          echo
          echo "Dependency output:"
          cat dependencies.txt

      - name: Copy DLL dependencies
        shell: msys2 {0}
        run: |
          set -e

          BIN="RFF-EXP-Windows/bin"

          grep -Eoi '[A-Za-z0-9._+-]+\.dll' dependencies.txt \
            | sort -fu \
            > dll-list.txt || true

          echo "DLLs reported by ntldd:"
          cat dll-list.txt || true

          echo

          while IFS= read -r dll
          do
            [ -z "$dll" ] && continue

            dll_lower="$(
              echo "$dll" |
              tr '[:upper:]' '[:lower:]'
            )"

            case "$dll_lower" in
              api-ms-win-*|\
              ext-ms-win-*|\
              kernel32.dll|\
              kernelbase.dll|\
              ntdll.dll|\
              user32.dll|\
              gdi32.dll|\
              gdi32full.dll|\
              advapi32.dll|\
              shell32.dll|\
              ole32.dll|\
              oleaut32.dll|\
              ws2_32.dll|\
              wsock32.dll|\
              winmm.dll|\
              comdlg32.dll|\
              comctl32.dll|\
              shlwapi.dll|\
              rpcrt4.dll|\
              version.dll|\
              setupapi.dll|\
              imm32.dll|\
              dwmapi.dll|\
              msvcrt.dll|\
              ucrtbase.dll|\
              bcrypt.dll|\
              bcryptprimitives.dll|\
              crypt32.dll|\
              cryptbase.dll|\
              secur32.dll|\
              iphlpapi.dll|\
              wintrust.dll|\
              uxtheme.dll|\
              dbghelp.dll|\
              psapi.dll|\
              cfgmgr32.dll|\
              normaliz.dll|\
              dnsapi.dll|\
              powrprof.dll|\
              userenv.dll|\
              msasn1.dll|\
              ncrypt.dll|\
              avrt.dll|\
              opengl32.dll|\
              vulkan-1.dll)
                continue
                ;;
            esac

            # Already packaged?
            if find "$BIN" \
              -maxdepth 1 \
              -type f \
              -iname "$dll" \
              | grep -q .
            then
              continue
            fi

            # Look in CLANG64
            found="$(
              find /clang64/bin \
                -maxdepth 1 \
                -type f \
                -iname "$dll" \
                -print \
                -quit \
                2>/dev/null
            )"

            if [ -n "$found" ]; then
              echo "Copying $dll"
              cp "$found" "$BIN/"
              continue
            fi

            # It might be another DLL produced by this project.
            found="$(
              find . \
                -type f \
                -iname "$dll" \
                -print \
                -quit \
                2>/dev/null
            )"

            if [ -n "$found" ]; then
              echo "Copying project DLL $dll"
              cp "$found" "$BIN/"
              continue
            fi

            echo "WARNING: Could not find $dll"

          done < dll-list.txt

      - name: Copy OpenCV and FFmpeg runtime
        shell: msys2 {0}
        run: |
          set -e

          BIN="RFF-EXP-Windows/bin"

          patterns=(
            "libopencv_core-*.dll"
            "libopencv_imgproc-*.dll"
            "libopencv_imgcodecs-*.dll"
            "libopencv_videoio-*.dll"
            "libopencv_highgui-*.dll"

            "avcodec-*.dll"
            "avformat-*.dll"
            "avutil-*.dll"
            "swscale-*.dll"
            "swresample-*.dll"
          )

          echo "Copying dynamic multimedia libraries..."

          for pattern in "${patterns[@]}"
          do
            for file in /clang64/bin/$pattern
            do
              if [ -f "$file" ]; then
                name="$(basename "$file")"

                if [ ! -f "$BIN/$name" ]; then
                  echo "  + $name"
                  cp "$file" "$BIN/"
                fi
              fi
            done
          done

      - name: Final dependency pass
        shell: msys2 {0}
        run: |
          set -e

          BIN="RFF-EXP-Windows/bin"

          > final-dependencies.txt

          echo "Doing final dependency check..."

          while IFS= read -r -d '' file
          do
            ntldd "$file" \
              >> final-dependencies.txt \
              2>/dev/null || true

          done < <(
            find "$BIN" \
              -maxdepth 1 \
              -type f \
              \( -iname "*.exe" -o -iname "*.dll" \) \
              -print0
          )

          grep -Eoi '[A-Za-z0-9._+-]+\.dll' \
            final-dependencies.txt \
            | sort -fu \
            > final-dll-list.txt || true

          while IFS= read -r dll
          do
            [ -z "$dll" ] && continue

            dll_lower="$(
              echo "$dll" |
              tr '[:upper:]' '[:lower:]'
            )"

            case "$dll_lower" in
              api-ms-win-*|\
              ext-ms-win-*|\
              kernel32.dll|\
              kernelbase.dll|\
              ntdll.dll|\
              user32.dll|\
              gdi32.dll|\
              gdi32full.dll|\
              advapi32.dll|\
              shell32.dll|\
              ole32.dll|\
              oleaut32.dll|\
              ws2_32.dll|\
              wsock32.dll|\
              winmm.dll|\
              comdlg32.dll|\
              comctl32.dll|\
              shlwapi.dll|\
              rpcrt4.dll|\
              version.dll|\
              setupapi.dll|\
              imm32.dll|\
              dwmapi.dll|\
              msvcrt.dll|\
              ucrtbase.dll|\
              bcrypt.dll|\
              bcryptprimitives.dll|\
              crypt32.dll|\
              cryptbase.dll|\
              secur32.dll|\
              iphlpapi.dll|\
              wintrust.dll|\
              uxtheme.dll|\
              dbghelp.dll|\
              psapi.dll|\
              cfgmgr32.dll|\
              normaliz.dll|\
              dnsapi.dll|\
              powrprof.dll|\
              userenv.dll|\
              msasn1.dll|\
              ncrypt.dll|\
              avrt.dll|\
              opengl32.dll|\
              vulkan-1.dll)
                continue
                ;;
            esac

            if find "$BIN" \
              -maxdepth 1 \
              -type f \
              -iname "$dll" \
              | grep -q .
            then
              continue
            fi

            found="$(
              find /clang64/bin \
                -maxdepth 1 \
                -type f \
                -iname "$dll" \
                -print \
                -quit \
                2>/dev/null
            )"

            if [ -n "$found" ]; then
              echo "Final copy: $dll"
              cp "$found" "$BIN/"
            fi

          done < final-dll-list.txt

      - name: Create launcher
        shell: msys2 {0}
        run: |
          cat > RFF-EXP-Windows/run_RFF-EXP.bat <<'EOF'
          @echo off
          setlocal
          cd /d "%~dp0bin"
          RFF.exe
          if errorlevel 1 pause
          EOF

      - name: Show final package
        shell: msys2 {0}
        run: |
          echo
          echo "========================================"
          echo "RFF-EXP portable build"
          echo "========================================"

          echo
          echo "RFF-owned binaries:"
          find RFF-EXP-Windows/bin \
            -maxdepth 1 \
            -type f \
            \( -iname "RFF.exe" -o -iname "*vulkan_helper*.dll" \) \
            -printf "%f\n"

          echo
          echo "DLL count:"
          find RFF-EXP-Windows/bin \
            -maxdepth 1 \
            -type f \
            -iname "*.dll" \
            | wc -l

          echo
          echo "Package size:"
          du -sh RFF-EXP-Windows

          echo
          echo "All bin files:"
          find RFF-EXP-Windows/bin \
            -maxdepth 1 \
            -type f \
            -printf "%f\n" \
            | sort

      - name: Create portable ZIP
        shell: msys2 {0}
        run: |
          rm -f RFF-EXP-Windows.zip

          zip \
            -r \
            RFF-EXP-Windows.zip \
            RFF-EXP-Windows

          echo
          echo "Created:"
          ls -lh RFF-EXP-Windows.zip

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: RFF-EXP-Windows-Portable
          path: RFF-EXP-Windows.zip
          if-no-files-found: error
          retention-days: 30
